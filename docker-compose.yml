services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - "443:443"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./certificates:/app/certificates:ro

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3001
      GEMORA_DB_PATH: /app/database/gemora.sqlite
    ports:
      - "3001:3001"
    volumes:
      - gemora-db:/app/database

volumes:
  gemora-db:
